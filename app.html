<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miqnas ERP – TEST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F5; --card:#FFFFFF; --ink:#10231F; --muted:#5B6E6A; --line:#DDE6E3; --line2:#E8EEEC;
  --brand:#123F3A; --brand2:#107366; --accent:#E8753D; --accentInk:#A4441A;
  --ok:#067647; --okbg:#DCF3E6; --bad:#B42318; --badbg:#FEE4E2; --warn:#A4441A; --warnbg:#FDEBDD; --yel:#7A5A00; --yelbg:#FEF5D6;
  --blue:#1849A9; --bluebg:#E0EAFF;
  --r:14px; --side:248px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,sans-serif;font-size:14.5px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand2)}
.hidden{display:none!important}
.muted{color:var(--muted)}
.spacer{flex:1}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
.loading{padding:60px 20px;text-align:center;color:var(--muted)}
.loading:before{content:"";display:block;width:26px;height:26px;margin:0 auto 12px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand2);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.loading:before{animation:none}}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#B8C9C4}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#0D332F}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:#EAF0EE}
.btn.danger{color:var(--bad)}
.btn.small{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}
.btn.full{width:100%;margin-top:18px;padding:12px}
label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin:12px 0 6px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #C9D6D2;border-radius:10px;background:#fff;color:var(--ink);font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand2);outline-offset:-1px;border-color:transparent}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--brand2)}

/* login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--brand)}
.login{background:#fff;border-radius:18px;padding:34px 30px;width:100%;max-width:390px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.logo i{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--brand);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:17px}
.logo span{color:var(--accent)}
.login .logo{color:var(--brand)}
.login p{color:var(--muted);margin:8px 0 18px}

/* shell */
#appView{display:flex;min-height:100vh}
#side{width:var(--side);flex:none;background:var(--brand);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
#side .logo{color:#fff;padding:0 10px 20px}
#side .logo span{color:#F09A6B}
.nsec{font-size:11px;font-weight:600;color:#7E9B95;letter-spacing:.08em;padding:16px 14px 6px;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;color:#B9CCC8;font-size:14px;font-weight:500;background:none;border:0;width:100%;text-align:left;cursor:pointer}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.nav.on{background:rgba(255,255,255,.12);color:#fff}
.nav svg{flex:none}
.nav .nb{margin-left:auto;background:#D92D20;color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.sclock{margin-top:14px;background:rgba(255,255,255,.07);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;cursor:pointer;border:0;color:#fff;text-align:left;width:100%}
.sclock:hover{background:rgba(255,255,255,.11)}
.sclock small{font-size:12px;color:#9DB4AF}
.sclock b{font-size:20px;font-variant-numeric:tabular-nums}
.sclock .sh{display:flex;align-items:center;gap:6px;font-size:12px;color:#8FD9B5}
.sclock .sh i{width:7px;height:7px;border-radius:50%;background:#32D583}
.sclock .sh.off{color:#F4A27A}.sclock .sh.off i{background:#F97066}
.suser{margin-top:12px;display:flex;align-items:center;gap:10px;padding:12px 10px 2px;border-top:1px solid rgba(255,255,255,.1)}
.av{width:36px;height:36px;border-radius:50%;background:#DCEBE7;color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.suser .nm{display:flex;flex-direction:column;min-width:0;flex:1}
.suser .nm b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suser .nm small{font-size:12px;color:#9DB4AF}
.iconbtn{width:36px;height:36px;border-radius:9px;border:0;background:rgba(255,255,255,.08);color:#DCE7E4;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:rgba(255,255,255,.16);color:#fff}
#shell{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 32px;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
#top h1{margin:0;font-size:21px;font-weight:700}
#pgSub{font-size:13px;color:var(--muted);margin-top:2px}
#topActions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#bell{position:relative;width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
#bell:hover{border-color:#B8C9C4}
#bell .cnt{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#D92D20;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
#bellPanel{position:absolute;right:32px;top:66px;width:420px;max-width:calc(100vw - 24px);max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(16,35,31,.18);z-index:30}
#bellPanel .bh{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}
#main{padding:26px 32px 60px;max-width:1280px;width:100%}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card.flush{padding:0;overflow:hidden}
.chead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.chead h2,.chead h3{margin:0;font-size:16px;font-weight:700}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15.5px;margin:0 0 10px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:13px;color:var(--muted);font-weight:500}
.kpi b{font-size:30px;font-weight:700;line-height:1.15}
.kpi small{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:20px;align-items:start;margin-bottom:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1;min-width:150px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.card.flush .tbl-wrap,.flush>.tbl-wrap{border:0;border-radius:0}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:11px 16px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;background:#F8FAF9}
td{padding:13px 16px;border-bottom:1px solid var(--line2);font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer} tr.clk:hover td{background:#F4F8F7}
.sub2{font-size:12px;color:var(--muted);margin-top:2px}

/* pills */
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.p-in{background:var(--okbg);color:var(--ok)}
.p-out{background:#EEF2F1;color:#40514E}
.p-absent{background:var(--warnbg);color:var(--warn)}
.p-bad{background:var(--badbg);color:var(--bad)}
.p-prog{background:var(--bluebg);color:var(--blue)}
.p-run{background:var(--warnbg);color:var(--warn)}
.p-na{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.p-lock{background:#EEF2F1;color:var(--muted)}
.p-yel{background:var(--yelbg);color:var(--yel)}

/* alerts */
.al{display:flex;gap:14px;padding:13px 20px;border-bottom:1px solid var(--line2);align-items:flex-start;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.al:hover{background:#F7FAF9}
.al:last-child{border-bottom:0}
.al .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px}
.al .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.al .tx b{font-size:14px}
.al .tx span{font-size:13px;color:var(--muted)}
.al .tg{flex:none;font-size:10.5px;font-weight:700;border-radius:6px;padding:3px 8px;letter-spacing:.03em}
.sev-red .dot{background:#D92D20}.sev-red .tg{background:var(--badbg);color:var(--bad)}
.sev-orange .dot{background:var(--accent)}.sev-orange .tg{background:var(--warnbg);color:var(--warn)}
.sev-yellow .dot{background:#D6A100}.sev-yellow .tg{background:var(--yelbg);color:var(--yel)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.empty{padding:30px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ok);font-size:15px;margin-bottom:4px}

/* team list */
.tm{display:flex;align-items:center;gap:12px;padding:11px 20px;border-bottom:1px solid var(--line2)}
.tm:last-child{border-bottom:0}
.tm .av{position:relative}
.tm .av i{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;border:2px solid #fff}
.tm .tx{flex:1;min-width:0}
.tm .tx b{font-size:14px}
.tm .tx div{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .nums{text-align:right;font-size:12.5px;color:var(--muted);flex:none}
.tm .nums b{display:block;color:var(--ink);font-size:13px}

/* progress */
.pbar{position:relative;flex:1;height:8px;background:#E3EBE9;border-radius:99px;min-width:60px}
.pbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--brand2)}
.pbar>em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.pv{display:flex;align-items:center;gap:10px}
.pv span{font-size:12.5px;font-weight:600;white-space:nowrap}
.pv span small{color:var(--muted);font-weight:400}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:flex;align-items:center;gap:6px}

/* timeline */
.tl{position:relative;height:14px;border-radius:5px;background:#EEF2F1;overflow:hidden;min-width:160px}
.tl i{position:absolute;top:0;bottom:0}
.tl i.on{background:#7DD3A8}.tl i.off{background:#F4A27A}.tl i.gap{background:#C5CBD3}.tl i.brk{background:#B9C7F0}
/* deadlines + revisions */
.tdl{width:auto;padding:6px 8px;font-size:12.5px;border-radius:9px}
.tdl.late{border-color:var(--bad);color:var(--bad);background:var(--badbg)}
.tdue{font-size:12.5px;color:var(--muted);white-space:nowrap}.tdue.late{color:var(--bad);font-weight:700}
.tnbtn{border:0;background:none;color:var(--brand2);font-size:12.5px;font-weight:600;cursor:pointer;padding:0;text-align:left}
.tnotes{display:grid;gap:6px;background:#F7FAF9;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;max-width:640px}
.tnote{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.tnote span{color:var(--muted);font-size:12px}
.tnadd{display:flex;gap:8px;flex-wrap:wrap}.tnadd input{flex:1;min-width:200px;padding:7px 10px;font-size:13px}
.dupwarn{color:var(--bad);font-size:12.5px;margin-top:6px}
.brkbox{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--bluebg);color:var(--blue);font-size:14px}
.btn.brk{background:#fff;border-color:var(--blue);color:var(--blue)}

/* clock page */
.clock{max-width:560px;margin:0 auto;text-align:center;padding:30px 24px}
.big-time{font-size:46px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums;margin:10px 0}
.clock .btn{font-size:17px;padding:14px 38px;margin-top:16px;border-radius:12px}
.btn.out{background:var(--bad);border-color:var(--bad);color:#fff}
.share-ok{margin-top:16px;padding:10px 14px;border-radius:10px;background:var(--okbg);color:var(--ok);font-size:13.5px}
.notice{margin-top:18px;padding:12px 14px;border-radius:10px;background:#F1F5F4;color:var(--muted);font-size:13px;text-align:right;line-height:1.9}
.alarm{position:fixed;inset:0;background:rgba(15,25,25,.78);z-index:60;display:grid;place-items:center;padding:16px}
.alarm .card{max-width:440px;text-align:center;border-top:5px solid var(--bad)}
.alarm h2{color:var(--bad)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,20,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal .card{width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:24px}
.modal h2{margin-bottom:6px}
.mfoot{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px}
.check input{flex:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;z-index:70;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#cap{position:fixed;left:-10000px;top:0;width:2px;height:2px;opacity:0}

/* settings */
.set{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line2)}
.set:last-child{border-bottom:0}
.set .tx{flex:1 1 320px;min-width:0}
.set .tx label{margin:0 0 2px;font-size:14px}
.set .tx div{font-size:12.5px;color:var(--muted)}
.set input[type=number]{width:90px;text-align:center;font-weight:600}
.set .u{font-size:13px;color:var(--muted);min-width:64px}

/* projects & tasks */
.flt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.flt button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;cursor:pointer;color:var(--muted);font-size:13.5px}
.flt button span{font-size:12px;opacity:.8}
.flt button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.runlist{display:grid;gap:6px}
.runit{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.runit .ttime{margin-left:auto}
.phead{display:grid;gap:14px;margin-top:10px;border-top:4px solid var(--accent)}
.pmeta,.pteam{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px}
.pmeta b,.pteam b{color:var(--muted);font-weight:500;margin-right:6px}
.pteam{border-top:1px dashed var(--line);padding-top:12px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links.sm{margin-bottom:8px}
.lnk{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;padding:7px 12px;text-decoration:none;color:var(--ink);background:#F7FAF9;font-size:13px}
.lnk:hover{border-color:var(--brand2)}
.lnk b{color:var(--brand2)} .lnk span{color:var(--muted);font-size:12px}
.tgroup{margin-top:14px;padding:6px 20px 10px}
.tghead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.trow{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.trow:last-child{border-bottom:0}
.trow.na{opacity:.5}
.trow.locked .tt{color:var(--muted)}
.trow.running{background:#FFF8F2;margin:0 -20px;padding-inline:20px}
.trow.done .tt{text-decoration:line-through;text-decoration-color:var(--line);color:var(--muted)}
.tmain{flex:1;min-width:220px;display:grid;gap:5px}
.tt{font-weight:600;font-size:14.5px}
.twait{font-size:12.5px;color:var(--muted)}
.tlink{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.tlink>span:first-child{color:var(--muted)}
.tlink input{flex:1;min-width:180px;max-width:420px;padding:6px 10px;font-size:13px}
.tlink a{color:var(--brand2);overflow-wrap:anywhere}
.tside{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ttime{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:66px;text-align:center}
.tb{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 12px;cursor:pointer;font-size:13px;font-weight:700;min-width:118px}
.tb.play{background:var(--brand2);border-color:var(--brand2);color:#fff}
.tb.pause{background:#C4571F;border-color:#C4571F;color:#fff}
.tb.ghost{color:var(--muted);min-width:0}
.tb:hover{filter:brightness(.95)}
.tstat{width:auto;padding:7px 30px 7px 10px;font-size:13px;font-weight:600;border-radius:9px;cursor:pointer}
.tstat.p-out{background:#F1F4F3;color:#33463F;border-color:#D5DFDC}
.tstat.p-prog{background:#E6EEFB;color:var(--blue);border-color:#C3D4F3}
.tstat.p-in{background:var(--okbg);color:var(--ok);border-color:#B5E3C8}
.tstat:disabled{opacity:.6;cursor:not-allowed}
.tsep{width:1px;height:24px;background:var(--line);margin:0 4px}
.pform h3{margin:22px 0 4px;color:var(--brand2)}
.pfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 16px}
.pfsec{background:#F7FAF9;border:1px dashed var(--line);border-radius:12px;padding:4px 14px 12px}
.psel{display:flex;align-items:center;gap:10px;margin:0 0 4px}
.psel label{margin:0}
.psel select{max-width:460px;font-weight:600}
.en{direction:ltr}

/* blockers */
.blgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line)}
@media (max-width:900px){.blgrid{grid-template-columns:1fr}}

/* mobile */
@media (max-width:900px){
  #appView{flex-direction:column}
  #side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;gap:4px}
  #side .logo{padding:0 8px 0 4px}
  #nav{display:flex;gap:2px;overflow-x:auto;width:100%;order:3}
  .nsec{display:none}
  .nav{width:auto;white-space:nowrap;padding:8px 12px}
  .sclock{width:auto;margin:0 0 0 auto;padding:6px 10px;order:2}
  .sclock small{display:none}
  .sclock b{font-size:15px}
  .suser{display:none}
  #top{padding:12px 16px;position:static}
  #main{padding:18px 16px 50px}
  .two{grid-template-columns:1fr}
  #bellPanel{right:12px;top:60px}
}

/* ===== البريفات ===== */
.bapp{
  --bg:#F3F7F6; --surface:#FFFFFF; --ink:#0F2B27; --muted:#56706B; --line:#D3E2DF;
  --accent:#107366; --accent-ink:#FFFFFF; --accent-soft:#E5F1EF;
  --warn:#B4511C; --warn-soft:#FCEBDF; --done:#107366; --done-soft:#E1F0ED; --danger:#B3261E;
  --brand-deep:#123F3A; --brand-orange:#E8753D; --sand:#D8C7A3;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px; --logo-bg:#FFFFFF; --field:#F7F2E8; --warn-line:#F0B48F;
}
.bapp{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl}
.bapp .wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:20px 80px}
.bapp h1,.bapp h2,.bapp h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
.bapp button{font:inherit;cursor:pointer}
.bapp :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bapp .muted{color:var(--muted)}
.bapp .btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.bapp .btn:hover{border-color:var(--accent)}
.bapp .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bapp .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.bapp .btn.ghost:hover{color:var(--ink)}
.bapp .btn.danger{color:var(--danger)}
.bapp .btn:disabled{opacity:.5;cursor:default}
.bapp .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.bapp .brand{display:flex;flex-direction:column;gap:2px}
.bapp .brand small{color:var(--muted);font-size:13px}
.bapp .pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.bapp .pill.draft{background:var(--warn-soft);color:var(--warn)}
.bapp .pill.done{background:var(--done-soft);color:var(--done)}
.bapp .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bapp .bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
@media (prefers-reduced-motion:reduce){.bapp .bar>i{transition:none}}
.bapp .note{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.bapp .tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bapp .tools input{flex:1;min-width:0}
.bapp .ledger{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bapp .row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) 110px 120px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);width:100%;text-align:start;background:none;border-inline:0;border-bottom:0;color:inherit}
.bapp .row:first-child{border-top:0}
.bapp .row.head{font-size:12px;color:var(--muted);font-weight:600;background:var(--bg)}
.bapp button.row:hover{background:var(--accent-soft)}
.bapp .row .t{font-weight:600}
.bapp .row .s{font-size:13px;color:var(--muted)}
.bapp .row .p{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:640px){.bapp .row{grid-template-columns:minmax(0,1fr) auto}
.bapp .row .c3,.bapp .row .c2{display:none}
.bapp .row.head{display:none}}
.bapp .sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.bapp .progline{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bapp .progline .bar{flex:1}
.bapp .progline b{font-variant-numeric:tabular-nums;font-size:13px;min-width:3.5em}
.bapp .rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.bapp .rail button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 12px;font-size:13px}
.bapp .rail button.full{color:var(--done);border-color:var(--done)}
.bapp .rail button:hover{color:var(--ink);border-color:var(--accent)}
.bapp .sec{margin-top:28px;scroll-margin-top:120px}
.bapp .sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.bapp .sec-h h2{font-size:19px}
.bapp .sec-h .grp{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.02em}
.bapp .sec-h .cnt{margin-inline-start:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bapp .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.bapp .q{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:8px 20px;padding:14px 16px;border-top:1px solid var(--line)}
.bapp .q:first-child{border-top:0}
.bapp .q.cond{background:var(--accent-soft)}
.bapp .q label.l{font-weight:600;font-size:14px}
.bapp .q .h{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:pre-line}
.bapp .q .a{min-width:0}
.bapp .q.empty .a input,.bapp .q.empty .a textarea,.bapp .q.empty .a select{border-color:var(--warn-line)}
@media (max-width:640px){.bapp .q{grid-template-columns:minmax(0,1fr)}}
.bapp select,.bapp input[type=text],.bapp input[type=url],.bapp input[type=number],.bapp input[type=date],.bapp input[type=search],.bapp textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.bapp textarea{resize:vertical;min-height:64px}
.bapp select:focus,.bapp input:focus,.bapp textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.bapp input[dir=ltr]{text-align:left}
.bapp .seg{display:flex;flex-wrap:wrap;gap:6px}
.bapp .seg button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 14px;font-size:14px}
.bapp .seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bapp .checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;padding:14px 16px}
.bapp .chk{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--bg);font-size:14px;cursor:pointer}
.bapp .chk input{accent-color:var(--accent);width:17px;height:17px;flex:none}
.bapp .chk.on{border-color:var(--accent);background:var(--accent-soft)}
.bapp .formfoot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:28px}
.bapp .saved{font-size:13px;color:var(--muted)}
.bapp .logo-tile{flex:none;background:var(--logo-bg);border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;overflow:hidden}
.bapp .logo-tile img{width:100%;height:100%;object-fit:contain;padding:8%}
.bapp .vtitle{display:flex;gap:16px;align-items:center}
.bapp .vtitle .logo-tile{width:84px;height:84px}
.bapp .vtitle .tt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.bapp .thumb{width:34px;height:34px;border-radius:8px}
.bapp .storecell{display:flex;gap:10px;align-items:center;min-width:0}
.bapp .logo-pick{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:12px}
.bapp .logo-pick .logo-tile{width:72px;height:72px}
.bapp .logo-drop{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:12px;padding:12px 16px;color:var(--muted);cursor:pointer;background:var(--surface)}
.bapp .logo-drop:hover,.bapp .logo-drop.over{border-color:var(--accent);color:var(--ink)}
.bapp .logo-drop .plus{width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:22px;flex:none}
@media (max-width:640px){.bapp .vtitle .logo-tile{width:64px;height:64px}}
.pdfwrap{position:fixed;top:0;left:0;width:0;height:0;overflow:hidden;pointer-events:none}
.bapp .pdf-dark{--bg:#0B2420;--surface:#123F3A;--ink:#EAF3F1;--muted:#A3BDB8;--line:#22564F;--accent:#4FB8A8;--accent-ink:#06201C;--accent-soft:#17514A;--warn:#F2A47C;--warn-soft:#3B2A1F;--warn-line:#7A4A2E;--field:#0E302B;--done:#6CCBBB;--done-soft:#164C45;--danger:#F08A80;--brand-deep:#0B2420;--brand-orange:#EE8857;--sand:#D8C7A3;color-scheme:dark}
.bapp .pdf-light{--field:#F3F6F4;--bg:#FFFFFF;--surface:#FFFFFF;--ink:#16231F;--muted:#5E6B66;--line:#DCE3DF;--accent:#0F6B57;--accent-ink:#FFFFFF;--accent-soft:#E2EFEA;--warn:#9A6516;--warn-soft:#FBF0DC;--done:#2C7A4B;--done-soft:#E3F2E8;color-scheme:light}
.bapp .pdfdoc{width:794px;padding:4px 40px 24px;background:var(--bg);color:var(--ink);direction:rtl;font-family:var(--f-body);font-size:14px;line-height:1.6}
.bapp .pdfdoc .pdf-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;padding-bottom:12px}
.bapp .pdfdoc .sec-h .cnt,.bapp .pdfdoc .vhead .pill,.bapp .pdfdoc .vhead .m-prog,.bapp .pdfdoc .vhead .bar{display:none}
.bapp .pdfdoc .vq{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.bapp .pdfdoc .vtitle .logo-tile{width:84px;height:84px}
.bapp .credf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.bapp .cred{display:grid;gap:4px}
.bapp .credr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.bapp .credk{font-size:12px;color:var(--muted);min-width:3.6em}
.bapp .credv{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:14px;overflow-wrap:anywhere;min-width:0}
.bapp .mini{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:6px;padding:1px 8px;font-size:12px}
.bapp .mini:hover{color:var(--ink);border-color:var(--accent)}
.bapp .none{color:var(--muted);opacity:.6}
.bapp .accgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:14px}
.bapp .acc{border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;display:grid;gap:10px;background:var(--surface);min-width:0}
.bapp .acc-h{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.bapp .acc-h b{font-family:var(--f-display);font-weight:600;font-size:15px}
.bapp .acc-ic{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:16px;flex:none}
.bapp .acc-ic.sm{font-size:11px;letter-spacing:.02em}
.bapp .acc-f{display:grid;gap:4px;min-width:0}
.bapp .acc-k{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);font-weight:500}
.bapp .acc-v{display:flex;align-items:center;gap:4px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 10px;min-width:0}
.bapp .acc-v .credv{flex:1;min-width:0;text-align:left;overflow-wrap:anywhere;font-size:13.5px;letter-spacing:.01em}
.bapp .ib{flex:none;width:28px;height:28px;display:grid;place-items:center;border:0;background:transparent;color:var(--muted);border-radius:6px}
.bapp .ib:hover{background:var(--surface);color:var(--accent)}
.bapp .ib.on{color:var(--accent)}
.bapp .pdfdoc .accgrid{grid-template-columns:1fr 1fr}
.bapp .vsec{margin-top:30px}
.bapp .vsec .sec-h{background:var(--accent-soft);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;padding:13px 18px;margin:0;align-items:center}
.bapp .vsec .sec-h h2{font-size:17px;color:var(--ink);display:flex;align-items:center;gap:10px}
.bapp .vsec .sec-h h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.bapp .vsec .sec-h .grp,.bapp .vsec .sec-h .cnt{display:none}
.bapp .vsec>.card{border-radius:0 0 12px 12px}
.bapp .grp-band{margin-top:40px;display:flex;align-items:center;gap:14px;color:var(--accent);font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:.01em}
.bapp .grp-band::after{content:"";flex:1;height:1px;background:var(--line)}
.bapp .vsec.sub{margin-top:14px}
.bapp .vsec.sub .sec-h{background:var(--surface);padding:11px 18px}
.bapp .vsec.sub .sec-h h2{font-size:15px;color:var(--accent)}
.bapp .vsec.sub .sec-h h2::before{width:6px;height:6px;background:transparent;border:1.5px solid var(--accent)}
.bapp .vsec.sub>.card{border-top:1px dashed var(--line)}
.bapp .login{max-width:380px;margin:48px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:grid;gap:8px}
.bapp .login h1{font-size:22px;margin-bottom:2px}
.bapp .login p{margin:0 0 10px}
.bapp .login label{font-size:13px;font-weight:600;margin-top:6px}
.bapp .login .btn.primary{justify-content:center;margin-top:12px;padding:10px}
.bapp .login .err{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:14px}
.bapp .login .ok{background:var(--done-soft);color:var(--done);border-radius:8px;padding:8px 12px;font-size:14px}
.bapp input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.bapp .userbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.bapp .userbar .ub-act{display:flex;gap:4px}
.bapp .linkbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bapp .linkbox input{flex:1;min-width:0}
.bapp .vhead{border-top:4px solid var(--brand-orange)}
.bapp .vsec .sec-h h2::before{background:var(--brand-orange)!important}
.bapp .vsec.sub .sec-h h2::before{background:transparent!important;border-color:var(--brand-orange)!important}
.bapp .grp-band::after{background:linear-gradient(90deg,var(--line),var(--brand-orange))!important;height:2px!important}
.bapp .login{border-top:4px solid var(--brand-orange)}
.bapp .userbar b{color:var(--accent)}
.bapp .acc-h{border-bottom-color:var(--sand)!important}
.bapp .vhead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px}
.bapp .vhead h1{font-size:26px}
.bapp .meta{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px}
.bapp .meta span b{font-weight:500;color:var(--muted);margin-inline-end:6px}
.bapp .actions{display:flex;gap:8px;flex-wrap:wrap}
.bapp dl{margin:0}
.bapp .vq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:4px 20px;padding:11px 16px;border-top:1px solid var(--line)}
.bapp .vq:first-child{border-top:0}
.bapp .vq dt{color:var(--muted);font-size:14px}
.bapp .vq dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.bapp .vq dd.none{color:var(--muted);opacity:.6}
@media (max-width:640px){.bapp .vq{grid-template-columns:minmax(0,1fr)}}
.bapp .tags{display:flex;flex-wrap:wrap;gap:6px}
.bapp .tag{font-size:13px;border-radius:6px;padding:2px 10px;background:var(--done-soft);color:var(--done)}
.bapp .tag.off{background:transparent;color:var(--muted);border:1px dashed var(--line);text-decoration:line-through;text-decoration-color:var(--line)}
.bapp .confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:14px}
.bapp .toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;z-index:20}
.bapp label{display:revert;margin:0;color:inherit;font-size:inherit}
.bapp .card{padding:0}
.bapp input[type=checkbox]{padding:0;width:17px}
.bapp input[type=file]{display:none}
.bapp .btn:hover{background:var(--surface)}
.bapp .btn.primary:hover{background:var(--accent);filter:brightness(1.08)}
.bapp .btn.ghost:hover{background:transparent}
.bapp .btn.small{padding:8px 14px;font-size:inherit}
.bapp .wrap{padding-block:4px 60px}
.bapp .row>div{flex:initial;min-width:0}
.bapp [hidden]{display:none!important}
.bapp .sticky{top:var(--hdr,0px)}
.bapp .sec{scroll-margin-top:calc(var(--hdr,0px) + 120px)}
.bapp .assign{display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
.bapp .assign .seg button{display:inline-flex;align-items:baseline;gap:2px}


</style>
</head>
<body>

<div id="loginView" class="login-wrap hidden">
  <form class="login" id="loginForm">
    <div class="logo"><i>M</i>Miqnas <span>ERP</span></div>
    <p>Sign in with your username and password</p>
    <label for="lu">Username</label>
    <input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="lp">Password</label>
    <input id="lp" type="password" autocomplete="current-password" required>
    <button class="btn primary full" id="lbtn">Sign in</button>
    <div class="err" id="lerr"></div>
  </form>
</div>

<div id="appView" class="hidden">
  <aside id="side">
    <div class="logo"><i>M</i>Miqnas <span>ERP</span></div>
    <nav id="nav" aria-label="Main"></nav>
    <div class="spacer"></div>
    <button class="sclock hidden" id="sClock" onclick="go('clock')"></button>
    <div class="suser" id="sUser"></div>
  </aside>
  <div id="shell">
    <header id="top">
      <div><h1 id="pgTitle"></h1><div id="pgSub"></div></div>
      <div class="spacer"></div>
      <div id="topActions"></div>
      <button id="bell" type="button" aria-label="Notifications"></button>
      <div id="bellPanel" class="hidden"></div>
    </header>
    <main id="main"></main>
  </div>
</div>

<video id="cap" muted playsinline></video>
<div id="modalRoot"></div>

<script>
/* ===== موديول البريفات ===== */

(function(){

const SITE_URL = window.ERP_SITE_URL || (location.origin + location.pathname);
const briefLink = id => SITE_URL + "#brief=" + id;

const PAY = ["تابي","تمارا","مدى","Visa","Apple Pay","Zid Pay","Salla Pay","الدفع عند الاستلام"];
const DOCS = ["وثيقة العمل الحر","الهوية الوطنية (National ID)","شهادة الضريبة (VAT Certificate)","العنوان الوطني (National Address)","الآيبان / شهادة بنكية (IBAN)","رقم توثيق المتجر (Store Verification Phone)","السجل التجاري (CR Number)","الرقم الضريبي (VAT Number)"];

const SECTIONS = [
 {id:"client", title:"بيانات العميل", items:[
  {id:"store_name", label:"اسم المتجر", type:"text"},
  {id:"client_name", label:"اسم العميل", type:"text"},
  {id:"am_name", label:"اسم الأكاونت مانجر", type:"text", headerOnly:true},
  {id:"zid_id", label:"الرقم التعريفي للمتجر على زد", type:"text", ltr:true},
  {id:"contact_times", label:"الأوقات المناسبة للتواصل", type:"text"},
  {id:"brief_date", label:"تاريخ البريف", type:"date"},
  {id:"drive", label:"لينك الدرايف الخاص بالعميل", type:"url"}]},
 {id:"scope", title:"Project Scope", items:[
  {id:"project_type", label:"نوع المشروع", type:"select", options:["نقل متجر","تحسين متجر","إنشاء متجر","نقل متجر كما هو"]},
  {id:"current_platform", label:"المنصة الحالية", type:"text", hint:"مثال: سلة"},
  {id:"target_platform", label:"المنصة اللي هينقل عليها", type:"text", hint:"مثال: زد"},
  {id:"store_url", label:"لينك المتجر الحالي", type:"url"},
  {id:"domain_owner", label:"الدومين مملوك لمين حاليًا؟", type:"text"},

const $ = s => document.querySelector(s);
let app = null;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const filled = v => Array.isArray(v) ? v.length > 0 : (v && typeof v==="object") ? Object.values(v).some(x=>String(x??"").trim()!=="") : (v !== undefined && v !== null && String(v).trim() !== "");
const cntText = c => c.t ? `${c.d} من ${c.t}` : "اختياري";
const visible = (it, a) => !it.showIf || it.showIf(a);
function progress(a){
  let t=0,d=0;
  for (const s of SECTIONS) for (const it of s.items){ if (it.type==="checks"||!visible(it,a)) continue; if (it.optional&&!filled(a[it.id])) continue; t++; if (filled(a[it.id])) d++; }
  return {t,d,pct:t?Math.round(d/t*100):0};
}
function secCount(s,a){let t=0,d=0;for(const it of s.items){if(!visible(it,a))continue;if(it.optional&&!filled(a[it.id]))continue;if(it.type==="checks"){t++;if(filled(a[it.id]))d++;continue;}t++;if(filled(a[it.id]))d++;}return {t,d};}
const fmtDate = v => { if(!v) return ""; const d=new Date(v); return isNaN(d)?"":d.toLocaleDateString("ar-EG",{day:"numeric",month:"short",year:"numeric"}); };
function toast(msg){ window.erpToast(msg); }
async function copy(text){try{await navigator.clipboard.writeText(text);toast("اتنسخ");}catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("اتنسخ");}catch(_){toast("ماقدرتش أنسخ، انسخ يدوي");}ta.remove();}}

}
function editBrief(id){

function field(it,a){
  const v=a[it.id], id="f_"+it.id;
  switch(it.type){
    case "textarea": return `<textarea id="${id}" data-k="${it.id}" rows="2">${esc(v)}</textarea>`;
    case "url": return `<input type="url" dir="ltr" id="${id}" data-k="${it.id}" value="${esc(v)}" placeholder="https://">`;
    case "cred": { const o=v||{}; return `<div class="credf">${it.named?`<input type="text" data-cred="${it.id}" data-part="n" value="${esc(o.n)}" placeholder="اسم المنصة" aria-label="اسم المنصة">`:""}<input type="text" dir="ltr" id="${id}" data-cred="${it.id}" data-part="u" value="${esc(o.u)}" placeholder="الإيميل أو اليوزر" aria-label="${esc(it.label)}: الإيميل أو اليوزر" autocomplete="off"><input type="text" dir="ltr" data-cred="${it.id}" data-part="p" value="${esc(o.p)}" placeholder="الباسورد" aria-label="${esc(it.label)}: الباسورد" autocomplete="off" spellcheck="false">${it.withLink?`<input type="url" dir="ltr" data-cred="${it.id}" data-part="l" value="${esc(o.l)}" placeholder="لينك منصة الدومين (اختياري)" aria-label="لينك منصة الدومين" style="grid-column:1/-1">`:""}</div>`; }
    case "select": { const opts=[...it.options]; if(filled(v)&&!opts.includes(v)) opts.push(v);
      return `<select id="${id}" data-k="${it.id}"><option value=""${filled(v)?"":" selected"}>اختار...</option>${opts.map(o=>`<option value="${esc(o)}"${v===o?" selected":""}>${esc(o)}</option>`).join("")}</select>`; }
    case "number": return `<input type="number" min="0" inputmode="numeric" id="${id}" data-k="${it.id}" value="${esc(v)}">`;
    case "date": return `<input type="date" id="${id}" data-k="${it.id}" value="${esc(v)}">`;
    case "yn": case "choice": {
      const opts=it.type==="yn"?["أيوه","لا"]:it.options;
      return `<div class="seg" role="group" aria-label="${esc(it.label)}">${opts.map(o=>`<button type="button" data-one="${it.id}" data-v="${esc(o)}" aria-pressed="${v===o}">${esc(o)}</button>`).join("")}</div>`;}
    case "multi": return `<div class="seg" role="group" aria-label="${esc(it.label)}">${it.options.map(o=>`<button type="button" data-many="${it.id}" data-v="${esc(o)}" aria-pressed="${(v||[]).includes(o)}">${esc(o)}</button>`).join("")}</div>`;
    default: return `<input type="text" id="${id}" data-k="${it.id}" value="${esc(v)}"${it.ltr?' dir="ltr"':""}>`;
  }
}

function railHTML(a){return SECTIONS.map(s=>{const c=secCount(s,a);return `<button type="button" data-sec="${s.id}" class="${c.t&&c.d===c.t?"full":""}">${esc(s.title)} <span style="font-variant-numeric:tabular-nums">${c.t?c.d+"/"+c.t:"اختياري"}</span></button>`;}).join("");}
function sectionHTML(s,a){
  const c=secCount(s,a);
  const body=s.items.filter(it=>visible(it,a)).map(it=>{
    if(it.type==="checks"){
      const sel=a[it.id]||[];
      return `<div class="checks" role="group" aria-label="${esc(it.label)}">${it.options.map(o=>`<label class="chk${sel.includes(o)?" on":""}"><input type="checkbox" data-chk="${it.id}" value="${esc(o)}"${sel.includes(o)?" checked":""}>${esc(o)}</label>`).join("")}</div>`;
    }
    return `<div class="q${it.showIf?" cond":""}${filled(a[it.id])||it.optional?"":" empty"}" data-q="${it.id}"${it.optional?" data-opt":""}>
      <div><label class="l" for="f_${it.id}">${esc(it.label)}</label>${it.hint?`<div class="h">${esc(it.hint)}</div>`:""}</div>
      <div class="a">${field(it,a)}</div></div>`;
  }).join("");
  return `<section class="sec" id="s_${s.id}"><div class="sec-h">${s.group?`<span class="grp">${esc(s.group)}</span>`:""}<h2>${esc(s.title)}</h2><span class="cnt">${cntText(c)}</span></div><div class="card">${body}</div></section>`;
}
function bindForm(){

    if(el.tagName==="TEXTAREA") autosize(el);

  const csv="﻿"+[head,...rows].map(r=>r.map(cell).join(",")).join("\r\n");
  try{ await downloads.save({filename:"briefs-"+new Date().toISOString().slice(0,10)+".csv", data:csv}); }
  catch(e){ if(!(e&&e.code==="declined")) toast("ماقدرتش أصدّر الملف"); }
}
async function loadList(){
  if(!me) return;
  try{ const r=await api("listBriefs",session);
    const m=new Map(); for(const b of r.briefs){ const old=briefs.get(b.id); m.set(b.id, old&&!old.partial&&old.updatedAt>=b.updatedAt?old:b); }
    briefs=m; loaded=true; if(route.v==="list"||(route.v==="view"&&!briefs.has(route.id))) render(); }
  catch(e){ if(!/SESSION|الجلسة/.test(e.message)){ loaded=true; if(route.v==="list") app.innerHTML=`<div class="note">ماقدرتش أحمّل البريفات. ${esc(e.message)}</div>`; } }
}
async function loadFull(id){
  try{ const b=await api("getBrief",session,id); briefs.set(id,b); }
  catch(e){ briefs.delete(id); loaded=true; }
  if(route.v==="view"&&route.id===id) render();
}
function assignHTML(b){
  if(!b) return "";
  const cur=(b.assigned||[]);
  if(!canEditB(b)) return cur.length?`<div class="assign"><span class="muted" style="font-size:13px">Assigned team:</span><div class="tags">${cur.map(x=>`<span class="tag">${esc(x.name)}</span>`).join("")}</div></div>`:"";
  if(!teamUsers) return `<div class="assign"><span class="muted" style="font-size:13px">Assigned team: loading...</span></div>`;
  const on=new Set(cur.map(x=>x.u));
  return `<div class="assign"><div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><b style="font-size:14px">Assigned Team</b><span class="muted" style="font-size:12.5px">Only they can view it (read-only)</span></div>
    <div class="seg" id="asg">${teamUsers.map(t=>`<button type="button" data-asg="${esc(t.u)}" aria-pressed="${on.has(t.u)}">${esc(t.name)}<span style="opacity:.7;font-size:12px"> · ${esc(t.job||"")}</span></button>`).join("")}</div>
    <div><button class="btn" id="asgsave" hidden>Save Team</button></div></div>`;
}
function bindAssign(b){
  if(!canEditB(b)) return;
  if(!teamUsers){ window.erpCall("briefTeam",{}).then(r=>{ teamUsers=r; if(route.v==="view"&&route.id===b.id) renderView(); }).catch(e=>toast(e.message)); return; }
  const box=$("#asg"), sv=$("#asgsave"); if(!box) return;
  box.querySelectorAll("[data-asg]").forEach(x=>x.onclick=()=>{ x.setAttribute("aria-pressed", x.getAttribute("aria-pressed")!=="true"); sv.hidden=false; });
  sv.onclick=async()=>{ sv.disabled=true; sv.textContent="Saving...";
    const list=[...box.querySelectorAll('[data-asg][aria-pressed="true"]')].map(x=>x.dataset.asg);
    try{ const r=await window.erpCall("briefAssign",{id:b.id,assigned:list}); b.assigned=r; toast("اتحفظ الفريق ✓"); renderView(); }
    catch(e){ toast(e.message); sv.disabled=false; sv.textContent="Save Team"; } };
}
window.BriefModule={
  enter(el,user,opts){
    app=el; me=user.username; myName=user.name; myRole=user.role; isAdmin=user.role==="admin";
    canWrite=isAdmin||myRole==="am"; seeAccess=!!user.seeAccess;
    const id=opts&&opts.id;
    if(id){ route={v:"view",id}; setHash(id); render(); if(!briefs.has(id)||briefs.get(id).partial) loadFull(id); loadList(); }
    else { route={v:"list"}; setHash(""); render(); loadList(); }
    window.scrollTo(0,0);
  },
  leave(){ if(route.v==="edit"&&draft){ flush(false,draft); draft=null; } route={v:"list"}; setHash(""); }
};

})();

</script>

<script>
/* ============ الإعداد ============ */
// لينك الـ Web App اللي بينتهي بـ /exec
const API_URL = 'https://script.google.com/macros/s/AKfycbyrNtR6uVU9t9NUJpZ-dJ0mknN3uc_eTQ0Y85kRPt5qROsR4Vv7_Cdu4wMA4ywx7POXvg/exec';
// اللينك الأساسي للسيستم (بيستخدم في لينكات البريفات)
const SITE_URL = 'https://ops681.github.io/miqnas-test/';

const IN_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const S = { token:null, user:null, cfg:{shotMinutes:10}, view:null, status:null, skew:0, vt:0,
            stream:null, mode:null, lastShot:0, tick:null, pending:[], sharing:false,
            cache:{}, fetched:{}, pFilter:'Active', alertFilter:'all' };
const MODE_NAMES = { tab:'Tab', window:'Window', screen:'Full Screen' };
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LOADING = '<div class="loading">Loading...</div>';
// بيعرض الأسامي العربي صح جوه الجمل الإنجليزي
const bd = s => esc(s).replace(/[\u0600-\u06FF](?:[\u0600-\u06FF\s\d.,،:()\-\/]*[\u0600-\u06FF])?/g, m=>'<bdi>'+m+'</bdi>');

// نسخة التجربة: مفاتيح منفصلة عشان متختلطش بالسيستم الأصلي على نفس الدومين
const KP = 'test_';
function store(k,v){ try{ v==null? localStorage.removeItem(KP+k) : localStorage.setItem(KP+k,v);}catch(e){} }
function load(k){ try{ return localStorage.getItem(KP+k);}catch(e){ return null; } }

/* ============ الاتصال بالسيرفر ============ */
function call(action, params){
  params = Object.assign({}, params||{}, {token:S.token});
  const done = r => {
    if(r && r.ok) return r.data;
    if(r && r.error==='AUTH'){ forceLogin(); throw new Error('انتهت الجلسة، سجّل دخول تاني'); }
    throw new Error((r&&r.error)||'حصل خطأ');
  };
  if(IN_GAS){
    return new Promise((res,rej)=>{
      google.script.run.withSuccessHandler(r=>{ try{res(done(r));}catch(e){rej(e);} })
        .withFailureHandler(e=>rej(new Error(e.message||'مشكلة في الاتصال'))).api(action, params);
    });
  }
  // كل طلب ليه رقم مميز ثابت في كل المحاولات، عشان السيرفر مايسجلهوش مرتين
  params.rid = params.rid || (Date.now().toString(36) + Math.random().toString(36).slice(2,10));
  const body = JSON.stringify(Object.assign({action},params));
  const WAITS = [1000, 3000, 7000];
  const attempt = n => fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body})
    .then(r=>r.text())
    .then(t=>{ let r; try{ r=JSON.parse(t); }catch(e){ const err=new Error('BAD_REPLY'); err.transient=true; throw err; } return r; },
          e=>{ const err=new Error('NET'); err.transient=true; throw err; })
    .catch(e=>{
      if(!e.transient || n>=WAITS.length) throw e;
      const wait = WAITS[n] + Math.floor(Math.random()*500);
      return new Promise(res=>setTimeout(res, wait)).then(()=>attempt(n+1));
    });
  return attempt(0).then(done)
    .catch(e=>{ if(e && e.transient) throw new Error('مشكلة في الاتصال بالسيرفر. جرّب تاني بعد شوية'); throw e.message? e : new Error('مشكلة في الاتصال'); });
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),msg.length>40?6000:3200); }
window.erpCall = call;
window.erpToast = toast;
window.ERP_SITE_URL = SITE_URL;

/* ============ كاش (عشان كل صفحة تفتح على طول) ============ */
const PERSIST = ['dash','my','plist','users','board','settings','screen','blockers'];
function cacheKey(){ return 'erp_c_'+(S.user?S.user.username:''); }
function loadCache(){ try{ S.cache=JSON.parse(load(cacheKey())||'{}')||{}; }catch(e){ S.cache={}; } }
function saveCache(){
  clearTimeout(S.csT);
  S.csT=setTimeout(()=>{ const keep={}; PERSIST.forEach(k=>{ if(S.cache[k]) keep[k]=S.cache[k]; }); try{ store(cacheKey(), JSON.stringify(keep)); }catch(e){} },500);
}
function busyTyping(){ const a=document.activeElement; return a && $('main').contains(a) && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'); }
// بيعرض اللي متخزن فوراً، وبيجيب الجديد في الخلفية
function swr(key, action, params, render){
  const vt=S.vt, c=S.cache[key];
  if(c) render(c,false); else $('main').innerHTML=LOADING;
  return call(action, params).then(r=>{
    S.cache[key]=r; S.fetched[key]=Date.now(); saveCache();
    if(S.vt!==vt) return;
    if(c && busyTyping()) return;
    render(r,true);
  }).catch(e=>{ if(S.vt!==vt) return; if(!c) $('main').innerHTML=`<div class="card err">${esc(e.message)}</div>`; else toast(e.message); });
}

/* ============ اللوجين ============ */
$('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  $('lerr').textContent=''; $('lbtn').disabled=true; $('lbtn').textContent='Signing in...';
  try{
    const r = await call('login',{username:$('lu').value,password:$('lp').value});
    S.token=r.token; store('erp_token',r.token);
    S.user=r.user; S.cfg=r.cfg; store('erp_user',JSON.stringify(r.user));
    startApp();
    refreshMe();
  }catch(err){ $('lerr').textContent=err.message; }
  $('lbtn').disabled=false; $('lbtn').textContent='Sign in';
});

function forceLogin(){
  if(S.sharing) return;
  S.token=null; store('erp_token',null); store('erp_user',null);
  $('appView').classList.add('hidden'); $('loginView').classList.remove('hidden');
}

async function logout(){
  if(S.status && S.status.clockedIn && !confirm('انت لسه عامل بصمة دخول. لو خرجت السكرين شوتس هتقف. متأكد؟')) return;
  try{ call('logout'); }catch(e){}
  stopStream(false);
  store(cacheKey(),null);
  S.token=null; store('erp_token',null); store('erp_user',null);
  setTimeout(()=>location.reload(),150);
}

// بيفتح السيستم على طول من البيانات المتخزنة، وبيتأكد من السيرفر في نفس الوقت
function boot(){
  S.token=load('erp_token');
  let u=null; try{ u=JSON.parse(load('erp_user')||'null'); }catch(e){}
  if(!S.token){ $('loginView').classList.remove('hidden'); return; }
  if(u){ S.user=u; startApp(); refreshMe(); }
  else refreshMe(true);
}
async function refreshMe(first){
  try{
    const r=await call('me');
    const changed=!S.user || S.user.role!==r.user.role || S.user.clocks!==r.user.clocks || S.user.seeAccess!==r.user.seeAccess;
    S.user=r.user; S.cfg=r.cfg; setStatus(r.status); store('erp_user',JSON.stringify(r.user));
    if(first||changed) startApp(); else { renderSide(); if(S.view==='clock') viewClock(); }
    if(S.status && S.status.clockedIn && !S.sharing) showAlarm(true);
  }catch(e){ if(first){ $('loginView').classList.remove('hidden'); } }
}

/* ============ الشكل العام ============ */
const IC = {
  dash:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  tasks:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  brief:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  monitor:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.5 3.5 5.2"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  warn:'<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>'
};
const ico=(k,s)=>`<svg width="${s||18}" height="${s||18}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
const initials = n => { n=String(n||'').trim(); const p=n.split(/\s+/); return (p.length>1? p[0][0]+p[1][0] : n.slice(0,2)).toUpperCase(); };

function navFor(u){
  const r=u.role, N=[];
  const add=(id,label,icon,sec)=>N.push({id,label,icon,sec});
  if(r!=='team') add('dash','Dashboard','dash','Workspace');
  if(u.clocks) add('clock','Time Clock','clock','Workspace');
  if(r==='team') add('mytasks','My Tasks','tasks','Workspace');
  if(r!=='team') add('projects','Projects','folder','Workspace');
  if(r==='admin'||r==='am') add('blockers','Blockers','flag','Workspace');
  if(r!=='hr') add('briefs','Briefs','brief','Workspace');
  if(r==='admin'||r==='hr'){ add('today','Attendance','cal','People'); add('monthly','Monthly Report','chart','People'); add('screen','Screen Report','monitor','People'); add('users','Employees','users','People'); }
  if(r==='admin') add('settings','Settings','gear','System');
  return N;
}
function renderSide(){
  const N=navFor(S.user);
  let sec='', h='';
  N.forEach(n=>{ if(n.sec!==sec){ sec=n.sec; h+=`<div class="nsec">${sec}</div>`; } h+=`<button class="nav${S.view===n.id?' on':''}" data-v="${n.id}">${ico(n.icon)}<span>${n.label}</span>${n.id==='mytasks'&&S.myBadge?`<span class="nb">${S.myBadge}</span>`:''}</button>`; });
  $('nav').innerHTML=h;
  $('nav').querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.v));
  $('sUser').innerHTML=`<div class="av">${esc(initials(S.user.name))}</div><div class="nm"><b>${esc(S.user.name)}</b><small>${esc(S.user.roleName)}${S.user.job&&S.user.job!==S.user.roleName?' · '+esc(S.user.job):''}</small></div><button class="iconbtn" onclick="logout()" aria-label="Logout" title="Logout">${ico('out',17)}</button>`;
  renderSideClock();
}
function renderSideClock(){
  const el=$('sClock');
  if(!S.user||!S.user.clocks){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  const st=S.status||{};
  el.innerHTML = st.clockedIn
    ? `<small>Clocked in since ${esc(st.inT)}</small><b id="sideElapsed">--:--:--</b>${st.onBreak?`<span class="sh off"><i></i>On break</span>`:`<span class="sh${S.sharing?'':' off'}"><i></i>${S.sharing?'Screen sharing on':'Sharing stopped'}</span>`}`
    : `<small>Time Clock</small><b>Not clocked in</b><span class="sh off"><i></i>Clock in to start</span>`;
  tickAll();
}
function setTop(title, sub, actions){
  $('pgTitle').textContent=title||''; $('pgSub').textContent=sub||''; $('topActions').innerHTML=actions||'';
}

function startApp(){
  $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden');
  loadCache();
  renderSide();
  renderBell();
  const deep=briefFromHash();
  const N=navFor(S.user);
  if(deep && N.some(n=>n.id==='briefs')) go('briefs',{id:deep});
  else if(!S.view || !N.some(n=>n.id===S.view)) go(N[0].id==='clock' && S.user.role==='team' && S.status && S.status.clockedIn ? 'mytasks' : N[0].id);
  else go(S.view);
  startBellPolling();
  setTimeout(prefetch, 1200);
}

function briefFromHash(){ const m=(location.hash||'').match(/^#brief=(b[a-z0-9]{6,30})$/); return m? m[1] : null; }
window.addEventListener('hashchange',()=>{ const id=briefFromHash(); if(id && S.user && navFor(S.user).some(n=>n.id==='briefs') && S.view!=='briefs') go('briefs',{id}); });

function go(v,opts){
  if(S.view==='briefs' && v!=='briefs' && window.BriefModule) BriefModule.leave();
  S.view=v; S.vt++; S.proj=null;
  clearInterval(S.viewTimer);
  closeBell();
  $('nav').querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  window.scrollTo(0,0);
  const map={dash:viewDash,clock:viewClock,mytasks:viewMyTasks,projects:viewProjects,briefs:()=>viewBriefs(opts),today:viewToday,monthly:viewMonthly,screen:viewScreen,users:viewUsers,settings:viewSettings,blockers:viewBlockers};
  (map[v]||viewDash)();
}
function viewBriefs(opts){
  setTop('Briefs','');
  document.documentElement.style.setProperty('--hdr', ($('top').offsetHeight||0)+'px');
  $('main').innerHTML='<div class="bapp"><div class="wrap" id="bwrap"></div></div>';
  BriefModule.enter($('bwrap'), S.user, opts||{});
}

// تحميل مسبق في الخلفية، عشان الصفحات التانية تفتح على طول
async function prefetch(){
  const r=S.user.role, list=[];
  if(r!=='team') list.push(['dash','dash',{}],['plist','projList',{}]);
  if(r==='team') list.push(['my','myTasks',{}]);
  if(r==='admin'||r==='hr') list.push(['board','board',{}],['users','users',{}]);
  for(const [k,a,p] of list){
    if(S.fetched[k] && Date.now()-S.fetched[k]<60000) continue;
    try{ const d=await call(a,p); S.cache[k]=d; S.fetched[k]=Date.now(); if(k==='dash') renderBell(); }catch(e){ break; }
  }
  saveCache();
}

/* ============ مؤقت واحد لكل العدادات ============ */
function setStatus(st){ if(st) st._off=Date.now()-(st.serverNow||Date.now()); S.status=st; }
function fmtDur(ms){ ms=Math.max(0,ms); const h=Math.floor(ms/36e5), m=Math.floor(ms%36e5/6e4), s=Math.floor(ms%6e4/1e3); return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':'); }
function tickAll(){
  const now=Date.now();
  document.querySelectorAll('[data-live]').forEach(el=>{ const base=+el.dataset.total||0, since=+el.dataset.since||0; el.textContent=fmtDur(base+(since? now-S.skew-since : 0)); });
  const st=S.status;
  if(st && st.clockedIn){
    const v=fmtDur(now-(st._off||0)-st.inTs-(st.breakMs||0)-(st.onBreak?now-(st._off||0)-st.breakSince:0));
    const a=$('sideElapsed'); if(a) a.textContent=v;
    const b=$('elapsed'); if(b) b.textContent=v;
  }
}
setInterval(tickAll,1000);

/* ============ التنبيهات (الجرس) ============ */
function alertsList(){ const d=S.cache.dash; return d&&d.alerts? d.alerts : []; }
function renderBell(){
  const n=alertsList().length;
  $('bell').innerHTML=ico('bell',20)+(n?`<span class="cnt">${n>99?'99+':n}</span>`:'');
  $('bell').setAttribute('aria-label','Notifications'+(n?', '+n:''));
  if(!$('bellPanel').classList.contains('hidden')) openBell();
}
function alertHTML(a,i){
  return `<button class="al sev-${a.sev}" onclick="goAlert(${i})"><span class="dot"></span><span class="tx"><b>${bd(a.title)}</b><span>${bd(a.detail)}</span></span><span class="tg">${esc(a.tag)}</span></button>`;
}
function openBell(){
  const L=alertsList();
  $('bellPanel').innerHTML=`<div class="bh">Notifications<span class="spacer"></span>${S.user.role!=='team'?`<button class="btn ghost small" onclick="go('dash')">Open dashboard</button>`:''}</div>`+
    (L.length? L.slice(0,40).map(alertHTML).join('') : `<div class="empty"><b>All clear</b>No alerts right now.</div>`);
  $('bellPanel').classList.remove('hidden');
}
function closeBell(){ $('bellPanel').classList.add('hidden'); }
$('bell').onclick=e=>{ e.stopPropagation(); if($('bellPanel').classList.contains('hidden')){ openBell(); refreshDash(); } else closeBell(); };
document.addEventListener('click',e=>{ if(!$('bellPanel').contains(e.target) && e.target!==$('bell')) closeBell(); });
function goAlert(i){
  const a=alertsList()[i]; if(!a||!a.go) return;
  closeBell();
  if(a.go.view==='project'){ if(S.user.role==='team'){ go('mytasks'); setTimeout(()=>viewProject(a.go.id),0); } else { go('projects'); viewProject(a.go.id); } }
  else go(a.go.view);
}
async function refreshDash(){
  try{ const d=await call('dash'); S.cache.dash=d; S.fetched.dash=Date.now(); saveCache(); renderBell(); if(S.view==='dash' && !busyTyping()) renderDash(d,true); }catch(e){}
}

function surfaceToMode(track){
  const s=(track.getSettings&&track.getSettings().displaySurface)||'';
  return s==='browser'?'tab': s==='window'?'window': 'screen';
}
async function startShare(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia)
    throw new Error('المتصفح ده مش بيدعم مشاركة الشاشة. افتح الصفحة من كروم أو إيدج على الكمبيوتر');
  let stream;
  try{
    stream = await navigator.mediaDevices.getDisplayMedia({ video:{frameRate:1}, audio:false, selfBrowserSurface:'include', surfaceSwitching:'include', monitorTypeSurfaces:'include' });
  }catch(e){
    if(IN_GAS) throw new Error('صفحة جوجل مش بتسمح بمشاركة الشاشة. افتح لينك السيستم الأساسي وابصم منه');
    if(e && e.name==='NotAllowedError') throw new Error('لازم توافق على مشاركة الشاشة عشان تقدر تبصم');
    throw new Error('مشاركة الشاشة مشتغلتش: '+(e.message||e.name));
  }
  const track=stream.getVideoTracks()[0];
  S.stream=stream; S.mode=surfaceToMode(track); S.sharing=true;
  const v=$('cap'); v.srcObject=stream; try{ await v.play(); }catch(e){}
  track.onended=onShareEnded;
  renderSideClock();
  return S.mode;
}
function stopStream(){
  S.sharing=false;
  clearInterval(S.tick);
  if(S.stream){ S.stream.getTracks().forEach(t=>{ t.onended=null; t.stop(); }); }
  S.stream=null;
  $('cap').srcObject=null;
  if(S.user) renderSideClock();
}
async function onShareEnded(){
  stopStream();
  try{ await call('shareEvent',{event:'stopped'}); }catch(e){}
  showAlarm(false);
}

async function clockOut(){

  const b=$('outBtn'); if(b){ b.disabled=true; b.textContent='Saving...'; }

    stopStream();
    setStatus(await call('clockOut'));
    toast('اتسجلت بصمة الخروج ✓');
    document.title='Miqnas ERP';
    renderSideClock();
    if(S.view==='clock') viewClock();
  }catch(e){ alert(e.message); if(b){ b.disabled=false; b.textContent='Clock Out'; } }

function startShotLoop(now){
  clearInterval(S.tick);
  const ms=S.cfg.shotMinutes*60000;
  if(now) setTimeout(()=>takeShot().catch(()=>{}),2500);
  S.tick=setInterval(()=>{
    if(!S.sharing) return;
    if(S.pending.length) flushPending();
    if(Date.now()-S.lastShot>=ms) takeShot().catch(()=>{});
  },20000);
}
async function grabCanvas(maxW){
  const track=S.stream&&S.stream.getVideoTracks()[0];
  if(!track||track.readyState!=='live') throw new Error('no stream');
  let src=null,w=0,h=0;
  if('ImageCapture' in window){ try{ const bmp=await new ImageCapture(track).grabFrame(); src=bmp; w=bmp.width; h=bmp.height; }catch(e){} }
  if(!src){ const v=$('cap'); src=v; w=v.videoWidth; h=v.videoHeight; }
  if(!w||!h) throw new Error('no frame');
  const sc=Math.min(1,maxW/w); const c=document.createElement('canvas'); c.width=Math.round(w*sc); c.height=Math.round(h*sc);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return { image: c.toDataURL('image/jpeg',0.6) };
}
async function takeShot(){
  if(!S.sharing) return;
  if(S.status && S.status.onBreak) return;
  const shot=await grabCanvas(1600);
  shot.mode=S.mode;
  S.lastShot=Date.now();
  try{ await call('uploadShot',shot); }
  catch(e){ if(S.pending.length<3) S.pending.push(shot); }
  const el=$('lastShotT'); if(el) el.textContent=new Date(S.lastShot).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
async function flushPending(){
  const p=S.pending.splice(0);
  for(const s of p){ try{ await call('uploadShot',s); }catch(e){ S.pending.push(s); break; } }
}

function exportCsv(){

/* ----- تقرير PDF للمنصة ----- */
function loadJs(src){ return new Promise((res,rej)=>{ const el=document.createElement('script'); el.src=src; el.onload=res; el.onerror=rej; document.head.appendChild(el); }); }
async function blockersPDF(pid){
  const r=S.cache['p:'+pid]; if(!r||!r.blockers) return;
  toast('بيجهّز الـ PDF...');
  try{
    if(!window.html2canvas) await loadJs('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await loadJs('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    try{ await document.fonts.ready; }catch(e){}
    const B=r.blockers.slice().sort((a,b)=>a.start<b.start?-1:1);
    const total=B.reduce((s,b)=>s+b.days,0);
    const host=document.createElement('div');
    host.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff;color:#10231F;font-family:IBM Plex Sans,IBM Plex Sans Arabic,sans-serif;padding:40px;box-sizing:border-box';
    host.innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #E8753D;padding-bottom:16px">
        <div><div style="font-size:12px;color:#5B6E6A;letter-spacing:.08em">MIQNAS · PROJECT BLOCKERS REPORT</div><div style="font-size:26px;font-weight:700;margin-top:6px" dir="auto">${esc(r.client)}</div><div style="font-size:13px;color:#5B6E6A;margin-top:4px">${esc(r.id)} · ${esc(r.type)} · Start ${fmtD(r.start_date)} · Target Launch ${fmtD(r.target_launch)}</div></div>
        <div style="text-align:right;font-size:12px;color:#5B6E6A">Generated<br><b style="color:#10231F;font-size:13px">${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</b></div>
      </div>
      <div style="display:flex;gap:12px;margin:20px 0">
        ${[['Blockers',B.length],['Days blocked (total)',total],['Caused by client',B.filter(b=>b.cause==='Client').length],['Caused by platform',B.filter(b=>b.cause==='Platform').length]].map(k=>`<div style="flex:1;border:1px solid #DDE6E3;border-radius:10px;padding:12px"><div style="font-size:11px;color:#5B6E6A">${k[0]}</div><div style="font-size:24px;font-weight:700">${k[1]}</div></div>`).join('')}
      </div>
      ${B.map((b,i)=>`<div class="pblk" style="border:1px solid #DDE6E3;border-radius:10px;padding:14px 16px;margin-bottom:12px">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px">
          <b style="font-size:14px">#${i+1} · ${esc(b.cat)}</b>
          <span style="background:${b.cause==='Platform'?'#FEF5D6':'#FDEBDD'};border-radius:99px;padding:2px 9px;font-weight:700">Caused by ${esc(b.cause)}</span>
          <span style="background:${b.status==='Resolved'?'#DCF3E6':'#FEE4E2'};border-radius:99px;padding:2px 9px;font-weight:700">${esc(b.status)}</span>
          <span style="margin-left:auto;color:#5B6E6A">${fmtD(b.start)} → ${b.status==='Resolved'?fmtD(b.resolved):'still open'} · <b style="color:#10231F">${b.days} days</b></span>
        </div>
        <div style="margin-top:8px;font-size:13.5px;white-space:pre-wrap" dir="auto">${esc(b.details)}</div>
        ${b.evidence?`<div style="margin-top:6px;font-size:12px;color:#107366;word-break:break-all">Evidence: ${esc(b.evidence)}</div>`:''}
        ${b.updates.length?`<div style="margin-top:8px;border-top:1px dashed #DDE6E3;padding-top:6px">${b.updates.map(u=>`<div style="font-size:12px;margin-top:3px"><span style="color:#5B6E6A">${new Date(u.at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})} · ${esc(u.by)}:</span> <span dir="auto">${esc(u.text)}</span></div>`).join('')}</div>`:''}
      </div>`).join('') || '<div style="color:#5B6E6A">No blockers recorded.</div>'}`;
    document.body.appendChild(host);
    const hr=host.getBoundingClientRect();
    const cuts=[...host.querySelectorAll('.pblk')].map(e=>e.getBoundingClientRect().bottom-hr.top+6);
    const canvas=await html2canvas(host,{scale:2,backgroundColor:'#ffffff',logging:false});
    host.remove();
    const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:'pt',format:'a4',compress:true});
    const PW=pdf.internal.pageSize.getWidth(), PH=pdf.internal.pageSize.getHeight(), k=PW/794, maxH=PH/k-20, total2=canvas.height/2;
    let y0=0, pg=0;
    while(y0<total2-1){
      let y1=Math.min(total2,y0+maxH);
      if(y1<total2){ const c=cuts.filter(v=>v>y0+80&&v<=y1); if(c.length) y1=c[c.length-1]; }
      if(pg) pdf.addPage();
      const pc=document.createElement('canvas'); pc.width=canvas.width; pc.height=Math.round((y1-y0)*2);
      const ctx=pc.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,pc.width,pc.height); ctx.drawImage(canvas,0,Math.round(y0*2),canvas.width,pc.height,0,0,canvas.width,pc.height);
      pdf.addImage(pc.toDataURL('image/jpeg',0.92),'JPEG',0,10,PW,(y1-y0)*k);
      y0=y1; pg++;
    }
    pdf.save(('Blockers - '+r.client+' - '+r.id).replace(/[\\/:*?"<>|]+/g,' ')+'.pdf');
  }catch(e){ alert('ماقدرتش أعمل الـ PDF. '+(e&&e.message||'')); }
}
