<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>مِقناص · بورتال الشركاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" id="ptcss">
</head>
<body>
<div id="pt"><div class="pt-load">جاري التحميل...</div></div>
<script>
/* البورتال بيتحمّل بنفس رقم النسخة بتاع السيستم عشان أي تحديث يوصل على طول */
(function () {
  fetch('version.json?ts=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).catch(function () { return { v: String(Date.now()) }; })
    .then(function (m) {
      var v = encodeURIComponent(m.v);
      document.getElementById('ptcss').href = 'portal/portal.css?v=' + v;
      ['core/config.js', 'portal/portal.js'].forEach(function (src) { var s = document.createElement('script'); s.src = src + '?v=' + v; s.async = false; document.body.appendChild(s); });
    });
})();
</script>
</body>
</html>
